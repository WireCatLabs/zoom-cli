name: Main validation

# The full tests on every commit that lands on main, so a merge that breaks them shows up now
# and not at the next release. Nothing here publishes or tags: release.yml alone does that.
on:
  push:
    branches: [main]

# Each merge keeps its own validation: cancelling it would leave that commit unchecked (WC-CI-7).
concurrency:
  group: main-validation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
