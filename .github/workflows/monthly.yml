name: Monthly validation

on:
  schedule:
    - cron: "13 3 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@80f926999e22c82e3dfc6b37d1dbe11d3bda4309 # v1.0.0
    with:
      dependencies: true
      languages: '["actions","javascript-typescript"]'
