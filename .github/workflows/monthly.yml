name: Monthly validation

on:
  schedule:
    - cron: "13 3 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@d01cd75426d96a9e3805bc0b5f1b96b0e529f324 # v0.77.0
    with:
      dependencies: true
      languages: '["actions","javascript-typescript"]'
