name: Monthly validation

on:
  schedule:
    - cron: "13 3 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@d35f90ac1f4a73ede7b7d5cabc7b2a18208c5979 # v0.49.0
    with:
      dependencies: true
      languages: '["actions","javascript-typescript"]'
