name: Full validation
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  ci:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    uses: WireCatLabs/cli-core/.github/workflows/node-ci.yml@5940608f735c6de554b6180275ad58b01149b31b # v0.18.1
    with:
      checks: |
        pnpm docs:check
