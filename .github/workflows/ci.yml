name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  ci:
    if: github.event_name == 'push' || !github.event.pull_request.draft
    uses: WireCatLabs/cli-core/.github/workflows/node-ci.yml@404d0f94d6f87106f7b67bfc432eea5fd904caa8 # v0.18.1
    with:
      checks: |
        pnpm docs:check
