name: Release

# Started by bin/release. npm trusts this file by name (trusted publishing), so there is no npm
# token anywhere in this repository and renaming the file breaks publishing until npm is told.
#
# Three jobs so that the one able to publish runs no code from our dependencies: `build` installs
# and tests everything and hands over the tarball; `publish` holds the OIDC permission and only
# runs `npm publish` on that file; `tag` is the only one that may write to the repository.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and pack, run npm publish --dry-run, do not tag"
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          # npm's own guidance for release builds: no cache that could carry credentials in.
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: version not yet on npm
        id: version
        run: |
          version=$(node -p 'require("./package.json").version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${{ inputs.dry_run }}" != "true" ] && npm view "@wirecat/zoom-cli@$version" version --prefer-online >/dev/null 2>&1; then
            echo "::error::$version is already on npm — raise the version first"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm docs:check
      - run: pnpm build
      - run: pnpm smoke:bun
      - run: npm pack
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: wirecat-zoom-cli-${{ steps.version.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    # npm's trusted publisher entry names this environment; without it npm
    # answers the token exchange with "package not found".
    environment: npm
    permissions:
      id-token: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package

      # npm, not pnpm: npm's trusted publishing is the documented path. A tarball runs no
      # lifecycle scripts, and nothing is installed here.
      - run: npm publish "wirecat-zoom-cli-$VERSION.tgz" --access public ${{ inputs.dry_run && '--dry-run --loglevel verbose' || '' }}

      - name: wait for npm to show the version
        if: ${{ !inputs.dry_run }}
        run: |
          # The version's own document, not `npm view`: on 2026-10-01 the document answered while the
          # version list `npm view` reads was still stale, and two releases went untagged.
          for _ in $(seq 90); do
            curl -sfo /dev/null "https://registry.npmjs.org/@wirecat%2fzoom-cli/$VERSION" && exit 0
            sleep 10
          done
          echo "::error::npm does not show $VERSION after fifteen minutes — not tagging; tag v$VERSION by hand once it does"
          exit 1

  tag:
    needs: [build, publish]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "$VERSION"
          git push origin "v$VERSION"
